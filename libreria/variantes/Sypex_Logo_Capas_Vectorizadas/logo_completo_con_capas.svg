<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="271" viewBox="0 0 600 271" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for Isotipo -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8008"/>
      <stop offset="100%" stop-color="#FFC837"/>
    </linearGradient>
  </defs>

  <!-- CAPA 1: ISOTIPO (Símbolo / Marca) -->
  <g id="capa-isotipo" inkscape:label="Capa 1 - Isotipo">
    <!-- Swoosh superior naranja -->
    <path d="M 80 35 C 150 5, 250 40, 290 85 C 275 70, 240 45, 180 35 C 130 27, 95 30, 80 35 Z" fill="url(#orangeGrad)"/>
    
    <!-- Letra S principal -->
    <path d="M 85 85 C 80 60, 110 40, 165 45 C 220 50, 250 80, 230 115 C 215 140, 170 155, 135 170 C 100 185, 75 210, 95 245 C 110 270, 160 275, 200 260 C 240 245, 275 210, 290 170 L 250 160 C 240 190, 200 220, 150 220 C 110 220, 105 195, 125 180 C 145 165, 185 155, 215 135 C 245 115, 260 85, 235 60 C 210 35, 150 40, 120 55 C 95 68, 88 78, 85 85 Z" fill="url(#blueGrad)"/>

    <!-- Portapapeles (Clipboard) -->
    <g transform="translate(45, 130)">
      <rect x="0" y="15" width="75" height="95" rx="8" fill="#FFFFFF" stroke="#0052D4" stroke-width="4"/>
      <rect x="22" y="8" width="30" height="15" rx="4" fill="#0052D4"/>
      <circle cx="37" cy="15" r="4" fill="#FFFFFF"/>
      <!-- Líneas y checks -->
      <path d="M 12 35 L 18 42 L 28 30" fill="none" stroke="#0052D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="36" y1="36" x2="65" y2="36" stroke="#4364F7" stroke-width="4" stroke-linecap="round"/>
      
      <path d="M 12 55 L 18 62 L 28 50" fill="none" stroke="#0052D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="36" y1="56" x2="65" y2="56" stroke="#4364F7" stroke-width="4" stroke-linecap="round"/>

      <path d="M 12 75 L 18 82 L 28 70" fill="none" stroke="#0052D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="36" y1="76" x2="65" y2="76" stroke="#4364F7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Engranaje (Gear) -->
    <g transform="translate(170, 180)">
      <circle cx="35" cy="35" r="22" fill="#0052D4"/>
      <circle cx="35" cy="35" r="11" fill="#FFFFFF"/>
      <!-- Dientes del engranaje simplificados -->
      <path d="M 32 5 L 38 5 L 40 15 L 30 15 Z M 32 65 L 38 65 L 40 55 L 30 55 Z M 5 32 L 5 38 L 15 40 L 15 30 Z M 65 32 L 65 38 L 55 40 L 55 30 Z M 14 14 L 18 18 L 25 11 L 21 7 Z M 56 56 L 52 52 L 45 59 L 49 63 Z M 14 56 L 21 63 L 25 59 L 18 52 Z M 56 14 L 49 7 L 45 11 L 52 18 Z" fill="#0052D4"/>
    </g>
  </g>

  <!-- CAPA 2: TIPOGRAFÍA (Texto y Slogan) -->
  <g id="capa-tipografia" inkscape:label="Capa 2 - Tipografía">
    <!-- Texto principal Synpex -->
    <text x="235" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="75" fill="#0B2545">Syn<tspan fill="#FF8008">p</tspan><tspan fill="#0052D4">ex</tspan></text>
    
    <!-- Línea naranja separadora -->
    <path d="M 235 125 L 385 125" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- SISTEMA DE GESTIÓN -->
    <text x="235" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="3.5" fill="#0B2545">SISTEMA DE GESTIÓN</text>

    <!-- Tu gestión, más simple -->
    <text x="270" y="198" font-family="Georgia, serif" font-style="italic" font-weight="normal" font-size="22" fill="#0B2545">Tu gestión, <tspan font-weight="bold">más simple</tspan></text>

    <!-- Swoosh inferior derecho -->
    <path d="M 585 240 C 510 270, 400 270, 310 230 C 350 250, 450 260, 585 240 Z" fill="url(#orangeGrad)"/>
  </g>
</svg>
